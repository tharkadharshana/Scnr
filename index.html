<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scnr" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <!-- scripts/prerender.mjs replaces everything between the seo markers with the tags from src/lib/seo.ts for each public page. These are the dev-server defaults. -->
    <!--seo:start-->
    <title>Scnr | Dynamic QR Codes with Real-Time Analytics</title>
    <meta name="description" content="Dynamic QR codes with scan analytics. Change where a printed code points without reprinting." />
    <!--seo:end-->
    <!-- Signed-in visitors never need the prerendered public page; hide it before first paint so it does not flash. -->
    <script>try{for(var k in localStorage)if(/^sb-.*-auth-token$/.test(k)){document.documentElement.className+=' has-session';break}}catch(e){}</script>
    <style>.has-session #prerender{display:none}</style>
    <!-- Fonts load without blocking first paint (display=swap shows fallback text meanwhile). -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=Caveat:wght@600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=Caveat:wght@600&display=swap" /></noscript>
